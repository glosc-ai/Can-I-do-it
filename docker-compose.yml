name: can-i-do-its

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # SECURITY: Set REDIS_PASSWORD in your .env and pass it here via
    # --requirepass so the instance is not open without authentication if
    # the port is ever accidentally exposed.
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # 从 GitHub Container Registry 拉取预构建镜像。
    # 默认跟随 latest，可用 APP_IMAGE_TAG 固定到具体版本（如 1.0.0 / sha-607c77a）。
    image: ghcr.io/glosc-ai/can-i-do-it:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DB_DRIVER: ${DB_DRIVER:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@postgres:5432/app?sslmode=disable}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      # SECURITY: Replace with a random secret before deploying.
      # A default value is intentionally avoided here so that a missing
      # JWT_SECRET causes startup to fail rather than silently using a
      # well-known string in production.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production}
      JWT_ISSUER: ${JWT_ISSUER:-go-vue-starter}
      JWT_TTL: ${JWT_TTL:-24h}
      SSO_DISCOVERY_URL: ${SSO_DISCOVERY_URL:-https://sso.gloscai.com/api/.well-known/openid-configuration}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-http://localhost:8080/api/v1/auth/callback}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-can_i_session}
      SESSION_TTL: ${SESSION_TTL:-24h}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      R2_ENABLED: ${R2_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      R2_REGION: ${R2_REGION:-auto}
      R2_FORCE_PATH_STYLE: ${R2_FORCE_PATH_STYLE:-false}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY must be exactly 32 characters in production}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_API_KEY: ${AI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
